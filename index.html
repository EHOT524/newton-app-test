<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Физика с Ньютоном</title>
<link rel="stylesheet" href="style.css?v=3">
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
</head>
<body>
<main id="app">
  <section id="loading" class="screen center">
    <div class="logo">🍎</div>
    <h1>Физика с Ньютоном</h1>
    <p id="loading-text" class="muted">Загружаем задания…</p>
    <div class="spinner"></div>
  </section>

  <section id="map" class="screen" hidden>
    <header class="topbar">
      <button id="open-settings" class="pill">🎓 <b id="mode-title"></b> <span id="level-title"></span> ▾</button>
      <div class="stats">
        <span class="stat" title="Опыт">⭐ <b id="xp">0</b></span>
        <span class="stat" title="Стрик">🔥 <b id="streak">0</b></span>
      </div>
    </header>
    <div class="quick">
      <button id="review" class="pill">🔁 Ошибки <b id="review-count">0</b></button>
      <button id="practice" class="pill">🧮 Тренировка формул</button>
    </div>
    <div id="path" class="path"></div>
    <p class="muted small note">Пробная версия. Прогресс хранится в Telegram и пока не связан с ботом.</p>
  </section>

  <section id="card" class="screen" hidden>
    <div class="lesson-top">
      <button id="card-close" class="icon-btn" aria-label="К карте">✕</button>
      <span class="muted small">Новое в этом шаге</span>
    </div>
    <h1 id="card-title"></h1>
    <div id="card-list" class="card-list"></div>
    <div class="sticky-action"><button id="card-start" class="btn primary big">Начать урок ▶️</button></div>
  </section>

  <section id="lesson" class="screen" hidden>
    <div class="lesson-top">
      <button id="quit" class="icon-btn" aria-label="Закончить урок">✕</button>
      <div class="bar"><div id="bar-fill"></div></div>
      <span id="counter" class="muted small"></span>
    </div>
    <div id="repeat-note" class="repeat" hidden>🔁 Повторим этот вопрос</div>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div id="typed" class="typed" hidden>
      <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Твой ответ">
    </div>
    <div class="lesson-actions">
      <button id="dunno" class="btn ghost">🤷 Не знаю</button>
      <button id="check" class="btn primary" disabled>Проверить</button>
    </div>
  </section>

  <section id="result" class="screen center" hidden>
    <div id="result-emoji" class="logo"></div>
    <h1 id="result-title"></h1>
    <div class="result-cards">
      <div class="card"><div class="muted small">Правильно</div><b id="res-correct"></b></div>
      <div class="card"><div class="muted small">Опыт</div><b id="res-xp"></b></div>
      <div class="card"><div class="muted small">Стрик</div><b id="res-streak"></b></div>
    </div>
    <p id="res-path" class="res-path" hidden></p>
    <p id="res-mistakes" class="muted"></p>
    <div class="actions">
      <button id="res-main" class="btn primary big"></button>
      <button id="res-map" class="btn secondary">🗺 К карте</button>
    </div>
  </section>
</main>

<div id="sheet" class="sheet" hidden>
  <div id="sheet-title" class="sheet-title"></div>
  <div id="sheet-body" class="sheet-body"></div>
  <button id="next" class="btn big">Дальше</button>
</div>

<div id="popover" class="popover" hidden>
  <div class="popover-box">
    <div id="pop-title" class="pop-title"></div>
    <div id="pop-text" class="muted small"></div>
    <button id="pop-go" class="btn big"></button>
  </div>
</div>

<div id="settings" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><h2>Настройки</h2><button id="close-settings" class="icon-btn" aria-label="Закрыть">✕</button></div>
    <h3>К чему готовимся?</h3>
    <div id="modes" class="chips"></div>
    <h3>Сложность</h3>
    <div id="levels" class="levels"></div>
  </div>
</div>

<script type="module" src="app.js?v=4"></script>
</body>
</html>
